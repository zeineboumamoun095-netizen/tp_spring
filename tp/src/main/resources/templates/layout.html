<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | Spring TP' : 'Spring TP'}">Spring TP</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-lightning-fill me-2"></i>Spring TP
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">
                        <i class="bi bi-box-seam me-1"></i>Produits
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/articles}">
                        <i class="bi bi-journal-text me-1"></i>Blog
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui.html" target="_blank">
                        <i class="bi bi-code-slash me-1"></i>API Docs
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── Contenu principal ────────────────────────────────────────── -->
<main class="container py-4" th:fragment="content">
    <!-- Le contenu de chaque page sera inséré ici -->
</main>

<!-- ── Footer ──────────────────────────────────────────────────── -->
<footer class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center text-muted small">
        <span>Spring Boot TP &copy; 2024 &mdash; Profil actif :
            <span class="badge bg-success" th:text="${@environment.getActiveProfiles()[0] ?: 'dev'}">dev</span>
        </span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
