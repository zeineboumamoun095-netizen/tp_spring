<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' | Blog'">Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-lightning-fill me-2"></i>Spring TP</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}"><i class="bi bi-box-seam me-1"></i>Produits</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/articles}"><i class="bi bi-journal-text me-1"></i>Blog</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/articles}">Blog</a></li>
                    <li class="breadcrumb-item active" th:text="${article.title}">Article</li>
                </ol>
            </nav>

            <!-- Message flash -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Article -->
            <article class="card shadow-sm border-0 mb-4">
                <div class="card-body p-5">
                    <h1 class="h3 fw-bold mb-2" th:text="${article.title}">Titre</h1>
                    <div class="text-muted small mb-4">
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${article.createdAt != null ? #temporals.format(article.createdAt, 'dd MMMM yyyy à HH:mm') : '—'}">date</span>
                        <span class="ms-3"><i class="bi bi-chat-dots me-1"></i>
                            <span th:text="${article.comments.size()} + ' commentaire(s)'">0</span>
                        </span>
                    </div>
                    <div class="article-content" th:text="${article.content}">Contenu</div>
                    <hr class="my-4">
                    <div class="d-flex gap-2">
                        <a th:href="@{/articles/edit/{id}(id=${article.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i>Modifier
                        </a>
                        <a th:href="@{/articles}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Retour
                        </a>
                    </div>
                </div>
            </article>

            <!-- Commentaires -->
            <section>
                <h4 class="fw-semibold mb-3">
                    <i class="bi bi-chat-dots me-2 text-success"></i>
                    Commentaires (<span th:text="${article.comments.size()}">0</span>)
                </h4>

                <!-- Liste des commentaires -->
                <div th:if="${article.comments.empty}" class="text-muted small mb-4">
                    <i class="bi bi-chat me-1"></i>Aucun commentaire. Soyez le premier !
                </div>

                <div class="mb-4" th:each="comment : ${article.comments}">
                    <div class="card border-0 bg-light">
                        <div class="card-body py-3 px-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="fw-semibold me-2">
                                        <i class="bi bi-person-circle me-1 text-primary"></i>
                                        <span th:text="${comment.author}">Auteur</span>
                                    </span>
                                    <small class="text-muted"
                                           th:text="${comment.createdAt != null ? #temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm') : ''}">date</small>
                                </div>
                                <a th:href="@{/articles/{aId}/comment/delete/{cId}(aId=${article.id}, cId=${comment.id})}"
                                   class="btn btn-sm text-danger border-0"
                                   onclick="return confirm('Supprimer ce commentaire ?')"
                                   title="Supprimer">
                                    <i class="bi bi-x-lg"></i>
                                </a>
                            </div>
                            <p class="mb-0 mt-2" th:text="${comment.text}">Texte</p>
                        </div>
                    </div>
                </div>

                <!-- Formulaire ajout commentaire -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h6 class="fw-semibold mb-3"><i class="bi bi-plus-circle me-2 text-success"></i>Ajouter un commentaire</h6>
                        <form th:action="@{/articles/{id}/comment(id=${article.id})}"
                              th:object="${newComment}"
                              method="post">

                            <div class="mb-3">
                                <label class="form-label fw-medium">Votre nom <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{author}"
                                       th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'"
                                       placeholder="Votre nom">
                                <div class="invalid-feedback" th:errors="*{author}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Commentaire <span class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{text}" rows="3"
                                          th:classappend="${#fields.hasErrors('text')} ? 'is-invalid'"
                                          placeholder="Votre commentaire..."></textarea>
                                <div class="invalid-feedback" th:errors="*{text}"></div>
                            </div>

                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-send me-1"></i>Publier
                            </button>
                        </form>
                    </div>
                </div>
            </section>

        </div>
    </div>
</main>

<footer class="footer mt-auto py-3 bg-light border-top mt-5">
    <div class="container text-center text-muted small">Spring Boot TP &copy; 2024</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
