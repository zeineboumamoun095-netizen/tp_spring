<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >Article | blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-lightning-fill me-2"></i>Spring TP</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}"><i class="bi bi-box-seam me-1"></i>Produits</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/articles}"><i class="bi bi-journal-text me-1"></i>Blog</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-semibold">
                        <i class="bi bi-journal-text me-2 text-success"></i>
                        <span th:if="${article.id != null}">Modifier l'article</span>
                        <span th:unless="${article.id != null}">Nouvel article</span>
                    </h5>
                </div>
                <div class="card-body p-4">

                    <!-- Formulaire création -->
                    <form th:if="${article.id == null}"
                          th:action="@{/articles/save}"
                          th:object="${article}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label fw-medium">Titre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="Titre de l'article">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Contenu <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{content}" rows="8"
                                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                      placeholder="Contenu de l'article..."></textarea>
                            <div class="invalid-feedback" th:errors="*{content}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg me-1"></i>Publier
                            </button>
                            <a th:href="@{/articles}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>

                    <!-- Formulaire modification -->
                    <form th:if="${article.id != null}"
                          th:action="@{/articles/update/{id}(id=${article.id})}"
                          th:object="${article}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label fw-medium">Titre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Contenu <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{content}" rows="8"
                                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{content}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg me-1"></i>Mettre à jour
                            </button>
                            <a th:href="@{/articles}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
