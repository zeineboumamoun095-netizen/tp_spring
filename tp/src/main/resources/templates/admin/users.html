<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Utilisateurs | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-shield-lock-fill me-2 text-warning"></i>Admin Panel
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}"><i class="bi bi-box-seam me-1"></i>Produits</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/articles}"><i class="bi bi-journal-text me-1"></i>Blog</a></li>
                <li class="nav-item ms-3">
                    <form th:action="@{/auth/logout}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-light">
                            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-people me-2 text-warning"></i>Gestion des Utilisateurs
            </h2>
            <small class="text-muted" th:text="${users.size()} + ' utilisateur(s) enregistré(s)'"></small>
        </div>
        <a th:href="@{/auth/register}" class="btn btn-warning">
            <i class="bi bi-person-plus me-1"></i>Nouvel utilisateur
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">#</th>
                    <th>Nom d'utilisateur</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="ps-4 text-muted small" th:text="${user.id}">1</td>
                    <td class="fw-semibold">
                        <i class="bi bi-person-circle me-2 text-secondary"></i>
                        <span th:text="${user.username}">username</span>
                        <!-- Marque "vous" sur le compte connecté -->
                        <span th:if="${#authentication.name == user.username}"
                              class="badge bg-secondary ms-1 small">vous</span>
                    </td>
                    <td class="text-muted small" th:text="${user.email}">email</td>
                    <td>
                        <span th:if="${user.role.name() == 'ADMIN'}"
                              class="badge bg-danger">
                            <i class="bi bi-shield-fill me-1"></i>ADMIN
                        </span>
                        <span th:if="${user.role.name() == 'USER'}"
                              class="badge bg-primary">
                            <i class="bi bi-person-fill me-1"></i>USER
                        </span>
                    </td>
                    <td>
                        <span th:if="${user.enabled}" class="badge bg-success bg-opacity-10 text-success">Actif</span>
                        <span th:unless="${user.enabled}" class="badge bg-danger bg-opacity-10 text-danger">Inactif</span>
                    </td>
                    <td class="text-end pe-4">
                        <!-- Ne pas supprimer son propre compte -->
                        <a th:if="${#authentication.name != user.username}"
                           th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Supprimer cet utilisateur ?')">
                            <i class="bi bi-trash"></i>
                        </a>
                        <span th:if="${#authentication.name == user.username}"
                              class="text-muted small">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
