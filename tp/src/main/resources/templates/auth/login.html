<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Spring TP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d6efd11 0%, #19875411 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.10);
        }
        .auth-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border-radius: 16px 16px 0 0;
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .form-control { border-radius: 8px; padding: 0.65rem 1rem; }
        .btn-login { border-radius: 8px; padding: 0.65rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-8">

            <div class="card auth-card">
                <div class="auth-header">
                    <i class="bi bi-lightning-fill fs-2 mb-2 d-block"></i>
                    <h4 class="fw-bold mb-1">Spring TP</h4>
                    <p class="mb-0 opacity-75 small">Connectez-vous à votre compte</p>
                </div>

                <div class="card-body p-4">

                    <!-- Messages -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <div th:if="${logoutMessage}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${logoutMessage}"></span>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${successMessage}"></span>
                    </div>

                    <!-- Formulaire — Spring Security traite le POST sur /auth/login -->
                    <form th:action="@{/auth/login}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-medium small">Nom d'utilisateur</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text"
                                       name="username"
                                       class="form-control border-start-0"
                                       placeholder="admin"
                                       required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium small">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password"
                                       name="password"
                                       class="form-control border-start-0"
                                       placeholder="••••••••"
                                       required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-login">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                        </button>
                    </form>

                    <hr class="my-3">

                    <!-- Comptes de démonstration -->


                    <div class="text-center mt-3 small">
                        Pas encore de compte ?
                        <a th:href="@{/auth/register}" class="text-primary fw-medium">S'inscrire</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
