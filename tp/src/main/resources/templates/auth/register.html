<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Spring TP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d6efd11 0%, #19875411 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-card { border: none; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
        .auth-header {
            background: linear-gradient(135deg, #198754, #146c43);
            border-radius: 16px 16px 0 0;
            padding: 1.75rem;
            text-align: center;
            color: white;
        }
        .form-control { border-radius: 8px; }
        .btn { border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-9">

            <div class="card auth-card">
                <div class="auth-header">
                    <i class="bi bi-person-plus-fill fs-2 mb-2 d-block"></i>
                    <h4 class="fw-bold mb-1">Créer un compte</h4>
                    <p class="mb-0 opacity-75 small">Votre rôle sera USER par défaut</p>
                </div>

                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/auth/register}"
                          th:object="${registerDto}"
                          method="post">

                        <!-- Username -->
                        <div class="mb-3">
                            <label class="form-label fw-medium small">Nom d'utilisateur <span class="text-danger">*</span></label>
                            <input type="text" class="form-control"
                                   th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                   placeholder="mon_username">
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-medium small">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="exemple@email.com">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-medium small">Mot de passe <span class="text-danger">*</span></label>
                            <input type="password" class="form-control"
                                   th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   placeholder="Au moins 6 caractères">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label class="form-label fw-medium small">Confirmer le mot de passe <span class="text-danger">*</span></label>
                            <input type="password" class="form-control"
                                   th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                   placeholder="Répétez le mot de passe">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="bi bi-person-check me-2"></i>Créer mon compte
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        Déjà un compte ?
                        <a th:href="@{/auth/login}" class="text-primary fw-medium">Se connecter</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
