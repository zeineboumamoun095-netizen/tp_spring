<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id != null ? 'Modifier' : 'Nouveau'} + ' Produit | Spring TP'">Produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-lightning-fill me-2"></i>Spring TP</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/products}"><i class="bi bi-box-seam me-1"></i>Produits</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/articles}"><i class="bi bi-journal-text me-1"></i>Blog</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-semibold">
                        <i class="bi bi-box-seam me-2 text-primary"></i>
                        <span th:text="${product.id != null ? 'Modifier le produit' : 'Nouveau produit'}">Produit</span>
                    </h5>
                </div>
                <div class="card-body p-4">

                    <!-- Formulaire de création -->
                    <form th:if="${product.id == null}"
                          th:action="@{/products/save}"
                          th:object="${product}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label fw-medium">Nom du produit <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Ex: Laptop Dell XPS 15">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Prix (€) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                       placeholder="Ex: 299.99">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      placeholder="Description optionnelle du produit..."></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Enregistrer
                            </button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>

                    <!-- Formulaire de modification -->
                    <form th:if="${product.id != null}"
                          th:action="@{/products/update/{id}(id=${product.id})}"
                          th:object="${product}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label fw-medium">Nom du produit <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Prix (€) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">€</span>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Mettre à jour
                            </button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
