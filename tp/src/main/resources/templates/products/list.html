<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits | Spring TP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-lightning-fill me-2"></i>Spring TP</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/products}"><i class="bi bi-box-seam me-1"></i>Produits</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/articles}"><i class="bi bi-journal-text me-1"></i>Blog</a></li>

            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Catalogue Produits</h2>
            <small class="text-muted" th:text="${total} + ' produit(s) au total'">0 produit(s)</small>
        </div>
        <a th:href="@{/products/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Ajouter un produit
        </a>
    </div>

    <!-- Message flash -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tableau -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${products.empty}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                <p>Aucun produit disponible. <a th:href="@{/products/new}">Ajouter le premier</a></p>
            </div>

            <div th:if="${!products.empty}" class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">#</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Description</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td class="ps-4 text-muted small" th:text="${product.id}">1</td>
                        <td class="fw-semibold" th:text="${product.name}">Produit</td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success fw-semibold"
                                  th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">0.00 €</span>
                        </td>
                        <td class="text-muted small">
                            <span th:text="${product.description != null ? #strings.abbreviate(product.description, 60) : '—'}">Description</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/products/delete/{id}(id=${product.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Supprimer ce produit ?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer class="footer mt-auto py-3 bg-light border-top mt-5">
    <div class="container text-center text-muted small">Spring Boot TP</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
