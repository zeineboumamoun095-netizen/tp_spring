# ─────────────────────────────────────────────────────────────────
#  PROFIL DEV  →  Base de données H2 (en mémoire)
#  Lancer avec : -Dspring.profiles.active=dev
# ─────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:springtp_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true           # Accès : http://localhost:8081/h2-console
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Recrée le schéma à chaque démarrage (dev)
    defer-datasource-initialization: true

  sql:
    init:
      mode: always            # Exécute data.sql au démarrage

logging:
  level:
    com.tp: DEBUG
    org.hibernate.SQL: DEBUG