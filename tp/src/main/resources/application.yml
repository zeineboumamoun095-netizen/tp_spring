spring:
  application:
    name: spring-tp

  # Profil actif par défaut
  profiles:
    active: dev

  # JPA config commune
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

server:
  port: 8081